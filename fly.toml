app = "ww3-intelligence"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "35s"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/ww3.db"
  WW3_STREAM_PATH = "/data/stream/events.jsonl"
  WW3_DISABLE_LLM = "1"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 15

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/_stcore/health"

    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[mounts]]
  source = "ww3_data"
  destination = "/data"
  snapshot_retention = 5

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
